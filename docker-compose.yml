services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PREDICTIVE_DATA_PATH: /app/Data/raw/online_retail_II.xlsx
      PREDICTIVE_ARTIFACT_PATH: /app/artifacts/forecast_model.joblib
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./Data/raw:/app/Data/raw:ro
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      PREDICTIVE_API_URL: http://api:8000
      PREDICTIVE_ARTIFACT_PATH: /app/artifacts/forecast_model.joblib
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      - api
